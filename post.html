<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Article | VALTIVRA</title>
    <!-- Tailwind CSS හෝ ඔයාලා පාවිච්චි කරන CSS ස්ටයිල්ස් මෙතැනට දෙන්න -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Markdown HTML වලට හරවන්න Marked.js ලයිබ්‍රරිය -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Header / Navigation -->
    <header class="border-b border-slate-800 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-blue-500">VALTIVRA.COM</a>
        <a href="index.html" class="text-sm text-slate-400 hover:text-white">← Back to Home</a>
    </header>

    <!-- Main Article Content -->
    <main class="max-w-3xl mx-auto px-6 py-12">
        <h1 id="article-title" class="text-3xl md:text-4xl font-extrabold mb-4"></h1>
        <div class="flex items-center space-x-4 text-sm text-slate-400 mb-8 pb-4 border-b border-slate-800">
            <span id="article-date"></span>
            <span>•</span>
            <span id="article-category" class="bg-blue-600/20 text-blue-400 px-2.5 py-1 rounded-full text-xs font-semibold"></span>
        </div>
        
        <!-- Markdown content එක HTML බවට පත්වී මෙතැනට වැටේ -->
        <div id="article-content" class="prose prose-invert max-w-none text-slate-300 space-y-6">
            Loading article...
        </div>
    </main>

  <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (fileName) {
            fetch(`content/blog/${fileName}`)
                .then(response => response.text())
                .then(markdownText => {
                    const parts = markdownText.split('---');
                    if (parts.length >= 3) {
                        const frontmatter = parts[1];
                        const bodyContent = parts.slice(2).join('---');

                        // Frontmatter එකෙන් ඩේටා ලබා ගැනීම
                        const titleMatch = frontmatter.match(/title:\s*"?(.*?)"?$/m);
                        const dateMatch = frontmatter.match(/date:\s*(.*?)$/m);
                        const catMatch = frontmatter.match(/category:\s*"?(.*?)"?$/m);

                        const title = titleMatch ? titleMatch[1] : "Untitled Article";
                        const date = dateMatch ? dateMatch[1] : "";
                        const category = catMatch ? catMatch[1] : "";

                        // HTML වලට ඩේටා සෙට් කිරීම
                        document.getElementById('page-title').innerText = title + " | VALTIVRA";
                        document.getElementById('article-title').innerText = title;
                        document.getElementById('article-date').innerText = date;
                        document.getElementById('article-category').innerText = category;

                        // Markdown content එක HTML වලට හරවා පිටුවට දැමීම
                        document.getElementById('article-content').innerHTML = marked.parse(bodyContent);
                    }
                })
                .catch(error => {
                    document.getElementById('article-content').innerHTML = "<p class='text-red-500'>Error loading article.</p>";
                });
        } else {
            document.getElementById('article-content').innerHTML = "<p>No article specified.</p>";
        }
    </script>
</body>
</html>
